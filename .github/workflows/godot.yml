name: Godot 4 The Hunt Validation and Desktop Exports
on:
  push:
    branches: [main]
    paths:
      - "godot/**"
      - ".github/workflows/godot.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  godot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: chickensoft-games/setup-godot@v2
        with:
          version: 4.4.1
          use-dotnet: false
          include-templates: true
      - name: Import and validate GDScript without ignored parse errors
        run: |
          set -o pipefail
          godot --headless --path godot --import --quit 2>&1 | tee godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|GDScript::reload|ERROR:" godot-import.log; then
            echo "Godot import emitted script errors"
            exit 1
          fi
      - name: Verify actual startup and both game modes
        run: |
          set -o pipefail
          godot --headless --path godot --script res://tests/smoke_test.gd 2>&1 | tee godot-smoke.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|GODOT SMOKE TEST FAILED|ERROR:" godot-smoke.log; then
            echo "Godot startup emitted errors"
            exit 1
          fi
          grep -F "GODOT SMOKE TEST PASS" godot-smoke.log
      - name: Export Windows desktop
        run: |
          mkdir -p dist
          godot --headless --path godot --export-release "Windows Desktop" ../dist/The-Hunt-Godot.exe
      - name: Export macOS app
        run: |
          godot --headless --path godot --export-release "macOS" ../dist/The-Hunt-Godot.app
      - name: Upload desktop exports
        uses: actions/upload-artifact@v4
        with:
          name: The-Hunt-Godot-Windows-macOS
          path: dist/*
          if-no-files-found: error
